plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

repositories {
    mavenCentral()
}

def githubRepoUrl = 'https://github.com/ppissias/JTransient'
def githubRepoScmUrl = 'https://github.com/ppissias/JTransient.git'
def centralArtifactId = 'jtransient'
def centralStagingRepository = layout.buildDirectory.dir('repos/central-staging')
def inMemorySigningKey = providers.gradleProperty('signingKey')
        .map { it.replace("\\n", "\n") }
        .orNull
def inMemorySigningPassword = providers.gradleProperty('signingPassword').orNull
def hasInMemorySigning = inMemorySigningKey != null && inMemorySigningPassword != null
def hasLegacySigning = findProperty('signing.keyId') != null &&
        findProperty('signing.password') != null &&
        findProperty('signing.secretKeyRingFile') != null
def signingConfigured = hasInMemorySigning || hasLegacySigning

group = 'io.github.ppissias.jtransient'
version = '1.0.6'
description = 'Java library for transient extraction and moving-object track linking on aligned monochrome astronomical image sequences.'

base {
    archivesName = centralArtifactId
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

sourceSets {
    consumer {
        compileClasspath = configurations.runtimeClasspath + sourceSets.main.output
        runtimeClasspath = output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

tasks.register('apiConsumer', JavaExec) {
    group = 'verification'
    description = 'Compiles and runs a current-version standalone API consumer on Java 21.'
    dependsOn tasks.named('consumerClasses')
    classpath = sourceSets.consumer.runtimeClasspath
    mainClass = 'io.github.ppissias.jtransient.consumer.ApiConsumer'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks adopted configuration/execution boundaries and prevents science depending on the engine facade.'
    dependsOn tasks.named('classes')
    inputs.files(sourceSets.main.output.classesDirs)
    inputs.files(configurations.runtimeClasspath)
    def report = layout.buildDirectory.file('reports/architecture/dependencies.txt')
    outputs.file(report)
    doLast {
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }.get()
        def suffix = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.exe' : ''
        def jdeps = launcher.metadata.installationPath.file("bin/jdeps${suffix}").asFile.absolutePath
        def output = providers.exec {
            commandLine([jdeps, '--ignore-missing-deps', '--multi-release', '21', '-verbose:class', '-filter:none',
                         '--class-path', configurations.runtimeClasspath.asPath] +
                    sourceSets.main.output.classesDirs.files.collect { it.absolutePath })
        }.standardOutput.asText.get()
        def violations = []
        output.eachLine { line ->
            def dependency = line =~ /^\s*io\.github\.ppissias\.jtransient\.(config|execution)(?:\.[\w$]+)*\s+->\s+io\.github\.ppissias\.jtransient\.([\w]+)/
            if (dependency.find() && dependency.group(2) != dependency.group(1)) violations.add(line.trim())
            def facadeDependency = line =~ /^\s*io\.github\.ppissias\.jtransient\.(core|quality|photometry)(?:\.[\w$]+)*\s+->\s+io\.github\.ppissias\.jtransient\.engine\.JTransientEngine\s+/
            if (facadeDependency.find()) violations.add(line.trim())
        }
        report.get().asFile.parentFile.mkdirs()
        report.get().asFile.text = output
        if (violations) throw new GradleException("Adopted architecture boundary violations: ${violations.join('; ')}")
    }
}

// The standalone API consumer runs when the Central bundle is prepared (bundleCentralPortal), not on every check.
tasks.named('check') {
    dependsOn tasks.named('verifyArchitecture')
}

tasks.withType(Javadoc).configureEach {
    // Keep generating javadocs for publication, but suppress boilerplate warning noise.
    options.addStringOption('Xdoclint:none', '-quiet')
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'

    testImplementation 'junit:junit:4.13.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = centralArtifactId

            pom {
                name = 'JTransient'
                description = project.description
                url = githubRepoUrl

                licenses {
                    license {
                        name = 'BSD 2-Clause License'
                        url = 'https://opensource.org/licenses/BSD-2-Clause'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = providers.gradleProperty('pomDeveloperId')
                        name = providers.gradleProperty('pomDeveloperName')
                        email = providers.gradleProperty('pomDeveloperEmail')
                        organization = providers.gradleProperty('pomDeveloperOrganization')
                        organizationUrl = providers.gradleProperty('pomDeveloperOrganizationUrl')
                    }
                }

                scm {
                    connection = "scm:git:${githubRepoScmUrl}"
                    developerConnection = 'scm:git:ssh://git@github.com/ppissias/JTransient.git'
                    url = githubRepoUrl
                }
            }
        }
    }

    repositories {
        maven {
            name = 'centralStaging'
            url = centralStagingRepository
        }
    }
}

signing {
    if (hasInMemorySigning) {
        useInMemoryPgpKeys(inMemorySigningKey, inMemorySigningPassword)
    }

    if (signingConfigured) {
        sign publishing.publications.mavenJava
    }
}

tasks.register('validateCentralReleaseConfiguration') {
    description = 'Checks that signing credentials are configured for Maven Central bundle generation.'
    group = 'publishing'

    doLast {
        if (!signingConfigured) {
            throw new GradleException(
                    'Central bundle generation requires signing credentials. ' +
                            'Set ORG_GRADLE_PROJECT_signingKey and ORG_GRADLE_PROJECT_signingPassword, ' +
                            'or configure signing.keyId/signing.password/signing.secretKeyRingFile.')
        }

        def checkNotBlank = { String propName ->
            def prop = providers.gradleProperty(propName).orNull
            if (prop == null || prop.trim().isEmpty()) {
                throw new GradleException("Missing required Gradle property for publication: '${propName}'.")
            }
        }
        checkNotBlank('pomDeveloperId')
        checkNotBlank('pomDeveloperName')
        checkNotBlank('pomDeveloperEmail')
        checkNotBlank('pomDeveloperOrganization')
        checkNotBlank('pomDeveloperOrganizationUrl')
    }
}

tasks.withType(Sign).configureEach {
    onlyIf('Central staging publication requested') {
        gradle.taskGraph.allTasks.any { task ->
            task.name == 'publishMavenJavaPublicationToCentralStagingRepository' ||
                    task.name == 'publishAllPublicationsToCentralStagingRepository' ||
                    task.name == 'bundleCentralPortal'
        }
    }
}

tasks.named('publishMavenJavaPublicationToCentralStagingRepository') {
    dependsOn tasks.named('validateCentralReleaseConfiguration')
}

tasks.register('bundleCentralPortal', Zip) {
    description = 'Builds a Maven Central Portal upload bundle from the signed staged Maven repository after the API consumer check.'
    group = 'publishing'
    dependsOn tasks.named('check'), tasks.named('apiConsumer')
    dependsOn tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
    from centralStagingRepository
    destinationDirectory = layout.buildDirectory.dir('distributions')
    archiveFileName = "${centralArtifactId}-${project.version}-central-bundle.zip"
}

tasks.register('mavenCentralBundle') {
    description = 'Standard alias for bundleCentralPortal to keep release commands consistent across repositories.'
    group = 'publishing'
    dependsOn tasks.named('bundleCentralPortal')
}
